<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RateSarthi — Redirecting...</title>
  <script src="frontend/js/config.js"></script>
  <script src="frontend/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof Auth !== 'undefined' && Auth.isAuthenticated()) {
        window.location.href = 'admin/dashboard.html';
      } else {
        window.location.href = 'login.html';
      }
    });
  </script>
</head>
<body style="background:#0f172a; color:#fff; font-family:sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0;">
  <div style="text-align:center;">
    <h2 style="margin-bottom:8px;">Navigating to RateSarthi Suite...</h2>
    <p style="color:#94a3b8; font-size:14px;">If you are not redirected automatically, <a href="admin/dashboard.html" style="color:#3b82f6;">click here to open Admin Dashboard</a>.</p>
  </div>
</body>
</html>
