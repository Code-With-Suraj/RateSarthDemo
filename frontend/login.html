<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RateSarthi — Login</title>
  <!-- Tailwind CSS v3 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
  
  <!-- Background Glow Accents -->
  <div class="absolute -top-40 -left-40 w-96 h-96 bg-blue-600/20 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-purple-600/20 rounded-full blur-3xl pointer-events-none"></div>

  <div class="max-w-md w-full relative z-10">
    
    <!-- Branding Header -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-500 text-white font-bold text-2xl shadow-lg shadow-blue-500/30 mb-4">
        R
      </div>
      <h1 class="text-2xl font-bold tracking-tight text-white">RateSarthi</h1>
      <p class="text-slate-400 text-sm mt-1">Vendor Rate Management & Comparison System</p>
    </div>

    <!-- Login Card -->
    <div class="bg-slate-800/90 backdrop-blur-xl border border-slate-700/80 rounded-2xl p-6 sm:p-8 shadow-2xl">
      <h2 class="text-lg font-bold text-white mb-6">Admin Sign In</h2>

      <div id="error-alert" class="hidden mb-4 p-3.5 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-400 text-xs font-medium"></div>

      <form id="login-form" onsubmit="handleLoginSubmit(event)" class="space-y-5">
        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Email Address</label>
          <input type="email" id="email" required placeholder="admin@ratesarthi.com" class="w-full px-4 py-3 rounded-xl bg-slate-900/80 border border-slate-700 text-white placeholder-slate-500 text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Password</label>
          <input type="password" id="password" required placeholder="••••••••" class="w-full px-4 py-3 rounded-xl bg-slate-900/80 border border-slate-700 text-white placeholder-slate-500 text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors">
        </div>

        <button type="submit" id="btn-login" class="w-full py-3.5 px-4 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold text-sm shadow-lg shadow-blue-500/25 transition-all duration-200 flex items-center justify-center gap-2">
          <span>Sign In</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
        </button>
      </form>

      <!-- Quick Demo Login Button -->
      <div class="mt-6 pt-5 border-t border-slate-700/60 text-center">
        <button onclick="fillDemoCredentials()" class="text-xs text-blue-400 hover:text-blue-300 font-medium transition-colors inline-flex items-center gap-1">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
          <span>Auto-fill Demo Credentials</span>
        </button>
      </div>
    </div>

    <!-- Footer -->
    <p class="text-center text-xs text-slate-500 mt-8">
      RateSarthi Procurement Engine &copy; 2026
    </p>

  </div>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // Redirect if already logged in
    if (Auth.isAuthenticated()) {
      window.location.href = 'admin/dashboard.html';
    }

    function fillDemoCredentials() {
      document.getElementById('email').value = 'admin@ratesarthi.com';
      document.getElementById('password').value = 'admin123';
    }

    async function handleLoginSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const btn = document.getElementById('btn-login');
      const errBox = document.getElementById('error-alert');

      errBox.classList.add('hidden');
      btn.disabled = true;
      btn.innerHTML = `<svg class="animate-spin w-4 h-4 text-white" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> <span>Authenticating...</span>`;

      try {
        const res = await Auth.login(email, password);
        if (res.success) {
          Utils.showToast('Login successful! Redirecting...', 'success');
          setTimeout(() => {
            window.location.href = 'admin/dashboard.html';
          }, 500);
        } else {
          errBox.textContent = res.message || 'Invalid email or password';
          errBox.classList.remove('hidden');
        }
      } catch (err) {
        errBox.textContent = 'Login error. Please try again.';
        errBox.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<span>Sign In</span> <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>`;
      }
    }
  </script>
</body>
</html>
