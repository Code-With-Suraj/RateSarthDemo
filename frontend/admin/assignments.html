<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RateSarthi — Vendor Item Mapping</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  
  <div id="app-layout">
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
      <div>
        <h3 class="text-xl font-bold text-slate-900 tracking-tight">Vendor Item Assignment</h3>
        <p class="text-xs text-slate-500">Assign master items to vendors. Rate requests only invite vendors for their assigned items.</p>
      </div>

      <!-- Vendor Selector Header -->
      <div class="w-full sm:w-80">
        <select id="vendor-select" onchange="onVendorSelected()" class="w-full px-4 py-2.5 rounded-xl bg-white border border-blue-300 font-bold text-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm">
          <option value="">-- Select Vendor --</option>
        </select>
      </div>
    </div>

    <!-- Action Toolbar & Counter -->
    <div id="assignment-actions" class="hidden mb-4 p-4 bg-white border border-slate-200 rounded-2xl flex flex-col sm:flex-row items-center justify-between gap-3 shadow-sm">
      <div class="flex items-center gap-3">
        <span id="selected-count-badge" class="px-3 py-1 rounded-full bg-blue-100 text-blue-700 text-xs font-bold font-mono">0 Items Selected</span>
        <div class="h-4 w-px bg-slate-200"></div>
        <button onclick="selectAllItems()" class="text-xs text-blue-600 font-semibold hover:text-blue-700">Select All</button>
        <span class="text-slate-300">•</span>
        <button onclick="deselectAllItems()" class="text-xs text-slate-500 font-semibold hover:text-slate-700">Deselect All</button>
      </div>

      <button id="btn-save-assignments" onclick="saveAssignmentsSubmit()" class="px-6 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold shadow-md shadow-blue-500/20 transition-all flex items-center gap-2">
        <span>Save Assignments</span>
      </button>
    </div>

    <!-- Items Category Grid Container -->
    <div id="assignment-items-container" class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm min-h-[300px]">
      <div class="text-center py-16 text-slate-400">
        <svg class="w-12 h-12 mx-auto mb-3 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/></svg>
        <p class="font-medium text-sm">Please select a vendor above to manage item assignments.</p>
      </div>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/assignments.js"></script>
</body>
</html>
